spring.application.name=car-export-backend
server.port=8080

# --- CORS ---
# Comma-separated origins the Angular dev server may call from.
app.cors.allowed-origins=http://localhost:4200

# In-memory H2 database for local development
spring.datasource.url=jdbc:h2:mem:carexport;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Concurrency: Caffeine read cache ---
# vehicleSearch is the search result cache. maximumSize bounds memory,
# expireAfterWrite bounds staleness. It is evicted wholesale by
# ListingUpdateService whenever scraped listings are refreshed.
spring.cache.type=caffeine
spring.cache.cache-names=vehicleSearch
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=10m

# --- RoRo maritime shipping ---
# Flat handling fee (port fees, documentation) added on top of the base freight rate.
shipping.handling-fee-eur=150.00

# --- Customs estimation ---
# Indicative rates for the cost breakdown shown on each vehicle card
# (import eligibility rules themselves live in ImportEligibilityService).
app.customs.duty-rate-percent=30.00
app.customs.vat-percent=19.00
app.customs.dzd-per-eur=250.00

# --- Scraping sources ---
# The two example connectors (GarageX, DynamicMarketplace) target fictional
# .example.com domains and are only kept as a reference. They stay disabled
# unless explicitly enabled here.
scraping.example-connectors.enabled=false

# --- Config-driven scraping ---
# Sources declared in scraping-sources.yml (sitemap + label/value spec grid)
# are registered as connector beans when this is true.
scraping.config-driven.enabled=true

# --- Source toggles ---
# CarXport is the slowest source (~1320 pages, ~30 min per round); it can be
# temporarily switched off to keep refresh rounds fast, e.g. while developing
# or testing other sources. Enabled by default when the property is absent.
scraping.carxport.enabled=true

# --- Per-source detail concurrency ---
# Worker threads fetching/parsing detail pages per connector. Higher values
# parallelize the round (CarXport at 8 → ~4 min instead of ~30) at the cost of
# a higher request rate seen by the target site. The config-driven sources set
# their own value in scraping-sources.yml (detailConcurrency).
scraping.carxport.detail-concurrency=6
scraping.exportcar213.detail-concurrency=4

# --- Scraping schedule ---
# Cadence of the automatic refresh round, in milliseconds (21_600_000 = 6 h).
scraping.refresh-interval-ms=21600000

# --- Security (HTTP Basic) ---
# Public endpoints (GET /api/...) stay open. The state-changing endpoint
# POST /api/health/refresh requires the ADMIN role below.
# Override both in production via environment variables.
app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:change-me-now}
