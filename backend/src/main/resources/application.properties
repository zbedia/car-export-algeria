spring.application.name=car-export-backend
server.port=8080

# --- CORS ---
# Comma-separated origins the Angular dev server may call from.
app.cors.allowed-origins=http://localhost:4200

# In-memory H2 database for local development
spring.datasource.url=jdbc:h2:mem:carexport;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Concurrency: Caffeine read cache ---
# vehicleSearch is the search result cache. maximumSize bounds memory,
# expireAfterWrite bounds staleness. It is evicted wholesale by
# ListingUpdateService whenever scraped listings are refreshed.
spring.cache.type=caffeine
spring.cache.cache-names=vehicleSearch
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=10m

# --- RoRo maritime shipping ---
# Flat handling fee (port fees, documentation) added on top of the base freight rate.
shipping.handling-fee-eur=150.00

# --- Scraping sources ---
# The two example connectors (GarageX, DynamicMarketplace) target fictional
# .example.com domains and are only kept as a reference. They stay disabled
# unless explicitly enabled here.
scraping.example-connectors.enabled=false

# --- Scraping schedule ---
# Cadence of the automatic refresh round, in milliseconds (21_600_000 = 6 h).
scraping.refresh-interval-ms=21600000
