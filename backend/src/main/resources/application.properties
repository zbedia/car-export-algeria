spring.application.name=car-export-backend
server.port=8080

# In-memory H2 database for local development
spring.datasource.url=jdbc:h2:mem:carexport;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Currency conversion (EUR / DZD) ---
# These are indicative placeholder rates, NOT fetched live.
# Update them manually to reflect current published/observed rates.
currency.rate.official-eur-to-dzd=145.50
currency.rate.parallel-eur-to-dzd=255.00

# --- RoRo maritime shipping ---
# Flat handling fee (port fees, documentation) added on top of the base freight rate.
shipping.handling-fee-eur=150.00
