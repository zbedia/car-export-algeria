# --- PostgreSQL profile ---
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# (or set spring.profiles.active=postgres in application.properties to make it permanent)
#
# Prerequisite: a running PostgreSQL instance with a database named
# car_export_algeria. From the project root:
#   docker compose up -d
# (see docker-compose.yml — this starts PostgreSQL with data persisted
# in a Docker volume, so it survives container restarts)

# stringtype=unspecified works around a known pgjdbc/Hibernate 6 bug
# where LIKE clauses without an explicit ESCAPE character (Hibernate
# emits `escape ''`) confuse the driver's parameter type inference,
# causing "function lower(bytea) does not exist" errors on any query
# using LIKE with a bind parameter. Kept here as a safety net for any
# future JPQL query — the vehicle search itself no longer needs it,
# since it was migrated to Specification/Criteria API queries, whose
# parameter types come from the entity metamodel and are never
# ambiguous to the driver in the first place (see VehicleSpecifications).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/car_export_algeria?stringtype=unspecified
# Credentials are overridable via environment variables. The defaults match the
# local docker-compose.yml so `docker compose up -d` works out of the box.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate no longer creates/updates the schema: migrations are managed
# by Flyway (db/migration/postgresql). ddl-auto=validate only verifies at
# startup that the JPA entities still match the schema Flyway produced.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
# Migrations live under db/migration/postgresql and replace the previous
# ddl-auto/schema-postgresql.sql + data-postgresql.sql bootstrap
# (schema.sql/data.sql mechanism dropped).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# --- Flyway (option 1 : baseline) ---
# La base dev existante a déjà été peuplée par l'ancien mécanisme
# (ddl-auto=update + schema-postgresql.sql) : elle contient vehicle_listing
# mais pas flyway_schema_history. baseline-on-migrate + baseline-version=1
# font adopter ce schéma par Flyway (marquage comme V1) SANS réappliquer
# V1__init_schema.sql (sinon CREATE TABLE en double). ddl-auto=validate
# confirme au démarrage que la table existante colle encore à l'entité JPA.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# The pre-existing dev database was bootstrapped by the now-removed
# ddl-auto=update + schema-postgresql.sql mechanism, so the "public" schema
# already contains vehicle_listing while flyway_schema_history is empty.
# baselineOnMigrate lets Flyway adopt the existing schema: it marks the
# current state as V1 and skips re-applying V1__init_schema.sql (ddl-auto=
# validate will verify at startup that the existing table still matches the
# entity). Disable (or drop the table) to have Flyway own the schema from
# scratch instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# The H2 console has nothing to show when running against PostgreSQL.
spring.h2.console.enabled=false
