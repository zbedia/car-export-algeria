# --- PostgreSQL profile ---
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# (or set spring.profiles.active=postgres in application.properties to make it permanent)
#
# Prerequisite: a running PostgreSQL instance with a database named
# car_export_algeria. From the project root:
#   docker compose up -d
# (see docker-compose.yml — this starts PostgreSQL with data persisted
# in a Docker volume, so it survives container restarts)

# stringtype=unspecified works around a known pgjdbc/Hibernate 6 bug
# where LIKE clauses without an explicit ESCAPE character (Hibernate
# emits `escape ''`) confuse the driver's parameter type inference,
# causing "function lower(bytea) does not exist" errors on any query
# using LIKE with a bind parameter. Kept here as a safety net for any
# future JPQL query — the vehicle search itself no longer needs it,
# since it was migrated to Specification/Criteria API queries, whose
# parameter types come from the entity metamodel and are never
# ambiguous to the driver in the first place (see VehicleSpecifications).
spring.datasource.url=jdbc:postgresql://localhost:5432/car_export_algeria?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the schema automatically from the entities.
# Fine for a personal/portfolio project — for a real production app,
# prefer a migration tool (Flyway or Liquibase) instead of "update".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Ensures Hibernate creates the tables before data-postgresql.sql tries
# to insert into them (same H2 pitfall from earlier, avoided here).
spring.jpa.defer-datasource-initialization=true

# Tells Spring Boot to run schema-postgresql.sql / data-postgresql.sql
# instead of the default schema.sql / data.sql (which are H2-specific
# and would fail against PostgreSQL).
spring.sql.init.platform=postgresql

# The H2 console has nothing to show when running against PostgreSQL.
spring.h2.console.enabled=false
