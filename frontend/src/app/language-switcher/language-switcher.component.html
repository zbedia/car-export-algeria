<div class="language-switcher">
  <button
    *ngFor="let language of languages"
    type="button"
    class="lang-button"
    [class.active]="translationService.lang() === language.code"
    (click)="select(language.code)"
    [attr.aria-label]="language.label"
    [title]="language.label"
  >
    <img class="flag" [src]="language.flagUrl" [alt]="language.label" />
  </button>
</div>
